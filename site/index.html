<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경상북도교육청 테스트 페이지</title>
  <style>
    :root {
      --gbe-blue: #0b4f9e;
      --gbe-blue-dark: #083a74;
      --ink: #1a2230;
      --muted: #5b6676;
      --line: #e4e8ef;
      --bg: #f5f7fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mark {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: var(--gbe-blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .org { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 56px 48px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.06);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--gbe-blue);
      background: #eaf2fc;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,0.18);
    }
    h1 {
      font-size: 28px;
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    p.sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      gap: 28px;
      font-size: 13px;
      color: var(--muted);
    }
    .meta b { display: block; color: var(--ink); font-size: 13.5px; margin-top: 3px; font-weight: 600; }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="mark">경</div>
      <div class="org">경상북도교육청</div>
    </div>
  </header>

  <main>
    <div class="card">
      <span class="badge"><span class="dot"></span>정상 작동 중</span>
      <h1>경상북도교육청 테스트 페이지입니다.</h1>
      <p class="sub">이 페이지는 배포 연동 확인을 위한 테스트 페이지입니다.<br>정상적으로 표시되고 있다면 서비스 연결이 완료된 것입니다.</p>
      <div class="meta">
        <div>상태<b>배포 성공</b></div>
        <div>환경<b>Onpod</b></div>
        <div>유형<b>정적 페이지</b></div>
      </div>
    </div>
  </main>

  <footer>&copy; 경상북도교육청 · Test Deployment</footer>
</body>
</html>
